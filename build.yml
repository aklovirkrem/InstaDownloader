name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manuel tetikleme butonu (Actions sekmesinden çalıştır)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle Wrapper kur (jar olmadan çalışır)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: APK derle
        run: gradle assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: APK dosyasını bul
        run: find . -name "*.apk" -type f

      - name: APK'yı indir olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: InstaGrab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Başarı mesajı
        run: |
          echo "✅ APK derlendi!"
          ls -lh app/build/outputs/apk/debug/ || true
